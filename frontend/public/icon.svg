        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 900;
        font-size: 38px;
        fill: #0d1520;
      }
      .dito {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-style: italic;
